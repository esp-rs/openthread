[workspace]
resolver = "2"
members = [
    "openthread",
    "openthread-driver",
    "openthread-driver-esp",
    "openthread-driver-nrf",
    "openthread-sys",
    "examples/std",
]

# `tests` cannot be a workspace member: its binaries run on
# `embassy_executor::raw` with their own `__pender` and embassy-time driver
# (the virtual-time lockstep executor), which clashes with `examples/std`.
exclude = ["examples/esp", "examples/nrf", "xtask", "tests", "tests/esp", "tests/nrf"]

[workspace.dependencies]
log = { version = "0.4", default-features = false }
defmt = { version = "1", default-features = false }
scopeguard = { version = "1", default-features = false }
rand_core = { version = "0.10", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embassy-futures = { version = "0.1", default-features = false }
heapless = { version = "0.9", default-features = false }
bitflags = { version = "2.13", default-features = false }
embassy-net-driver-channel = { version = "0.4", default-features = false }
embedded-io-async = { version = "0.7", default-features = false }
embedded-hal = { version = "1", default-features = false }
embedded-hal-async = { version = "1", default-features = false }
# Host (`std` feature) serial transport for the RCP driver: async serial over a
# `/dev/tty*` device. `async-io` provides the readiness-based async I/O (Unix);
# `nix` opens + configures the tty (termios). Windows support is a future
# addition (its serial handles need a different, overlapped-I/O path).
async-io = { version = "2", default-features = false }
nix = { version = "0.30", default-features = false }
esp-radio = { version = "1.0.0-beta.1", default-features = false }
esp-hal = { version = "~1.2.0", default-features = false }
nrf-802154 = { version = "0.1", default-features = false }

mbedtls-rs-sys = { version = "0.3", default-features = false }
openthread-sys = { version = "0.4", path = "openthread-sys", default-features = false }
openthread-driver = { version = "0.1", path = "openthread-driver", default-features = false }

# build dependencies
anyhow = { version = "1", default-features = false }
bindgen = { version = "0.72", default-features = false }
env_logger = { version = "0.11", default-features = false }
cmake = { version = "0.1.52", default-features = false }
cc = { version = "1.1", default-features = false }
fs_extra = { version = "1.3", default-features = false }
embuild = { version = "0.33", default-features = false }

# Until `nrf-802154` 0.2 is released
[patch.crates-io]
nrf-802154 = { git = "https://github.com/sysgrok/nrf-802154" }
