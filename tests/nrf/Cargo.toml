[package]
name = "openthread-tests-nrf"
version = "0.1.0"
edition = "2021"
resolver = "2"
publish = false
categories = ["embedded", "hardware-support"]
keywords = ["thread", "openthread", "embedded", "test"]
description = "The nRF52840/nRF54L15 firmware node of `openthread`'s hardware-in-the-loop test tier: the full stack on the MCU, with the `nrf-802154` radio driver, driven through its console by the upstream OpenThread test harness"
repository = "https://github.com/esp-rs/openthread"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 'z'
overflow-checks = false

[[bin]]
name = "cli_node"
path = "src/bin/cli_node.rs"
harness = false

[features]
default = ["nrf52840"]
force-generate-bindings = ["openthread/force-generate-bindings"]
# Put the console on the board's own USB peripheral instead of a UART, for a
# board whose only serial port *is* USB - a XIAO nRF52840 plugged straight into
# the host, or an nRF52840 dongle. The default is a UART, which is what a board
# reached through a debug probe's UART bridge needs (and the only thing an
# nRF54L15 can offer, having no USB peripheral at all).
console-usb = ["dep:embassy-usb"]
# Which pins the UART console comes out on. The default is the nRF52840-DK's
# J-Link virtual COM port (P0.06 TX, P0.08 RX); `console-uart-xiao` selects a
# XIAO nRF52840's D6/D7 pads (P1.11 TX, P1.12 RX), which is what a XIAO wired
# to an external debug probe's UART bridge needs. Ignored under `console-usb`,
# and on nRF54L15, whose console pins are fixed by its onboard probe.
console-uart-xiao = []
nrf52840 = [
    "nrf-802154/nrf52840",
    "openthread-driver-nrf/nrf52840",
    "nrf-mpsl/nrf52840",
    "embassy-nrf/nrf52840",
    "embassy-nrf/time-driver-rtc1",
]
nrf54l15 = [
    "nrf-802154/nrf54l15-app-s",
    "openthread-driver-nrf/nrf54l15-app-s",
    "nrf-mpsl/nrf54l15-app-s",
    "embassy-nrf/nrf54l15-app-s",
    "embassy-nrf/time-driver-grtc",
]

[dependencies]
nrf-802154 = { version = "0.1", default-features = false, features = ["defmt"] }
openthread-driver-nrf = { path = "../../openthread-driver-nrf", features = ["defmt"] }
nrf-mpsl = { version = "0.4", default-features = false, features = ["critical-section-impl"] }

# The feature set of `tests/esp` (plus `csl-receiver`), so that the harness
# meets the same CLI surface on both MCU nodes.
openthread = { path = "../../openthread", default-features = false, features = [
    "defmt",
    "ftd",
    "csl-receiver",
    "cli",
    "mac-filter",
    "ping-sender",
    "slaac",
    "ecdsa",
    "dns-client",
    "srp-client",
    "commissioner",
    "joiner",
    "border-router",
    "netdiag-client",
    "reference-device",
    "srp-server",
    "dnssd-server",
    "service",
    "netdata-publisher",
    "coap",
    "coaps",
    "dataset-updater",
    "child-supervision",
    "history-tracker",
    "anycast-locator",
    "neighbor-discovery-agent",
    "ip6-fragmentation",
    "dhcp6-client",
    "dhcp6-server",
    "diagnostic",
] }

# Only the pure-Rust pieces the C CLI references - NOT `all`, which pulls
# tinyrlibc's vendored C printf and with it a C cross-compiler, for a
# `vsnprintf` nobody needs (the `openthread` build carries nanoprintf).
tinyrlibc = { version = "0.5", default-features = false, features = [
    "alloc",
    "abs",
    "atoi",
    "isalpha",
    "isdigit",
    "isspace",
    "isupper",
    "itoa",
    "utoa",
    "memchr",
    "strcat",
    "strchr",
    "strcmp",
    "strcpy",
    "strcspn",
    "strlen",
    "strncasecmp",
    "strncmp",
    "strncpy",
    "strrchr",
    "strspn",
    "strstr",
    "strtol",
    "strtoul",
] }
embedded-alloc = { version = "0.7", default-features = false, features = ["llff"] }
embedded-storage-async = { version = "0.4.1", default-features = false }

embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "0.11", default-features = false, features = ["unstable-pac", "time"] }
embassy-sync = { version = "0.8", default-features = false, features = ["defmt"] }
embassy-futures = { version = "0.1", default-features = false }
embassy-time = { version = "0.5", default-features = false, features = ["defmt"] }
embassy-usb = { version = "0.5", default-features = false, features = ["defmt"], optional = true }

defmt = { version = "1", default-features = false }
defmt-rtt = { version = "1", default-features = false }

cortex-m = { version = "0.7", default-features = false }
cortex-m-rt = { version = "0.7", default-features = false }
panic-probe = { version = "1", default-features = false, features = ["print-defmt"] }
static_cell = { version = "2", default-features = false }
heapless = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }
critical-section = { version = "1.2", default-features = false }
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }

# Until `nrf-802154` 0.2 is released
[patch.crates-io]
nrf-802154 = { git = "https://github.com/sysgrok/nrf-802154" }
