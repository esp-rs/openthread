[package]
name = "openthread-tests-esp"
version = "0.1.0"
edition = "2021"
resolver = "2"
publish = false
categories = ["embedded", "hardware-support"]
keywords = ["thread", "openthread", "embedded", "test"]
description = "The ESP32-C6/H2 firmware node of `openthread`'s hardware-in-the-loop test tier: the full stack on the MCU, driven through its USB-Serial-JTAG console by the upstream OpenThread test harness"
repository = "https://github.com/esp-rs/openthread"
license = "MIT OR Apache-2.0"
rust-version = "1.84"

# Its own package - and its own target, toolchain config and lockfile - because
# it cross-compiles to `riscv32imac-unknown-none-elf` while the host side of
# the test crate is `std`. Same split the `examples/{nrf,esp,std}` tree uses.

[profile.dev]
# Rust debug is too slow for a radio with real deadlines.
opt-level = "z"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = "fat"
debug = 2
debug-assertions = false
overflow-checks = false

[features]
default = ["esp32c6"]
esp32c6 = [
    "esp-rtos/esp32c6",
    "esp-radio/esp32c6",
    "esp-hal/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-println/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-storage/esp32c6",
]
esp32h2 = [
    "esp-rtos/esp32h2",
    "esp-radio/esp32h2",
    "esp-hal/esp32h2",
    "esp-backtrace/esp32h2",
    "esp-println/esp32h2",
    "esp-bootloader-esp-idf/esp32h2",
    "esp-storage/esp32h2",
]
force-generate-bindings = ["openthread/force-generate-bindings"]

[dependencies]
embassy-executor = "0.10"
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-time = "0.5"
esp-hal = { version = "~1.1", features = ["log-04", "unstable", "exception-handler"] }
esp-rtos = { version = "0.3", features = ["esp-radio", "embassy"] }
esp-alloc = { version = "0.10" }
# Panics go to the console the harness parses - which is exactly where they
# belong: a dying node's last words end up in the failing test's log tail.
esp-backtrace = { version = "0.19", features = ["panic-handler", "println"] }
esp-println = { version = "0.17", features = ["log-04"] }
esp-radio = { version = "1.0.0-beta.0", features = ["unstable", "ieee802154"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["log-04"] }
# Settings persistence - see `src/flash_settings.rs`.
esp-storage = "0.9"
log = "0.4"
heapless = "0.9"
critical-section = "1.2"
rand_core = "0.9"
static_cell = "2.1"
embedded-io-async = "0.7"
# The C CLI library reaches for a good deal more of libc than the examples do
# (`cli_srp_client.cpp` alone wants `strchr`/`strncpy`) - but only the
# pure-Rust pieces: NOT `all`, which pulls tinyrlibc's vendored C printf and
# with it a C cross-compiler, for a `vsnprintf` nobody needs (the ESP ROM has
# one, and the `openthread` build carries nanoprintf anyway). No `alloc`
# either: `esp-alloc` exports the C malloc/free surface itself, and both
# defining `free` fails the link.
tinyrlibc = { version = "0.5", default-features = false, features = [
    "abs",
    "atoi",
    "isalpha",
    "isdigit",
    "isspace",
    "isupper",
    "itoa",
    "utoa",
    "memchr",
    "strcat",
    "strchr",
    "strcmp",
    "strcpy",
    "strcspn",
    "strlen",
    "strncasecmp",
    "strncmp",
    "strncpy",
    "strrchr",
    "strspn",
    "strstr",
    "strtol",
    "strtoul",
] }

# The same feature set the host DUT (`openthread-tests`' `cli_ftd`) is built
# with, so the harness meets the same CLI surface on either tier - minus the
# host-only ones. `esp-radio` is what brings in `EspRadio`; `log` (rather than
# the nRF node's `defmt`) so the two MCU nodes exercise both logging backends.
# (No `isupper`: `tinyrlibc` provides that symbol here, and enabling both
# makes the link fail on a duplicate definition.)
openthread = { path = "../../openthread", default-features = false, features = [
    "esp-radio",
    "log",
    "ftd",
    "cli",
    "mac-filter",
    "ping-sender",
    "slaac",
    "ecdsa",
    "dns-client",
    "srp-client",
    "commissioner",
    "joiner",
    "border-router",
    "netdiag-client",
    "reference-device",
    # The functional pool drives these on whichever node the script picks -
    # often node 1, i.e. this DUT. Their absence fails tests with
    # `Error 35: InvalidCommand` (found the hard way on the first extended
    # MCU sweep: the whole SRP family plus CoAP/DHCP6/fragmentation).
    "srp-server",
    "dnssd-server",
    "service",
    "netdata-publisher",
    "coap",
    "coaps",
    "dataset-updater",
    "child-supervision",
    "history-tracker",
    "anycast-locator",
    "neighbor-discovery-agent",
    "ip6-fragmentation",
    "dhcp6-client",
    "dhcp6-server",
] }

[[bin]]
path = "./src/bin/cli_ftd.rs"
name = "cli_ftd"
harness = false

# The released esp family lacks two fixes we need:
# - https://github.com/esp-rs/esp-hal/pull/6090
# - https://github.com/esp-rs/esp-hal/pull/6089
[patch.crates-io]
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "78c5852a762a26042bac59ccd57f941b85319bec" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "78c5852a762a26042bac59ccd57f941b85319bec" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "78c5852a762a26042bac59ccd57f941b85319bec" }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "78c5852a762a26042bac59ccd57f941b85319bec" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", rev = "78c5852a762a26042bac59ccd57f941b85319bec" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "78c5852a762a26042bac59ccd57f941b85319bec" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "78c5852a762a26042bac59ccd57f941b85319bec" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "78c5852a762a26042bac59ccd57f941b85319bec" }
