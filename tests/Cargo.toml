[package]
name = "openthread-tests"
version = "0.1.0"
edition = "2021"
resolver = "2"
publish = false
description = "Host-side integration-test binaries for `openthread`: simulation nodes wire-compatible with the upstream OpenThread simulation platform and test harness"
repository = "https://github.com/esp-rs/openthread"
license = "MIT OR Apache-2.0"
rust-version = "1.84"

[features]
default = []
# Regenerate the OpenThread bindings on the fly (needed until the committed
# host-target bindings match the active feature set).
force-generate-bindings = ["openthread/force-generate-bindings"]

[dependencies]
# No `platform-std`/`executor-thread`: the node binaries run on this crate's
# own executor (`src/executor.rs`, built on `embassy_executor::raw`), whose
# idle path implements the virtual-time lockstep protocol of the upstream
# simulator - and, in real-time mode, a plain poll-with-timeout. The arch
# features would define the global `__pender` this crate provides itself.
embassy-executor = "0.10"
# No `std`: that feature registers embassy's std time driver, while these
# binaries provide their own (real-time or virtual-time; same module).
embassy-time = { version = "0.5", default-features = false }
# The time-driver hook; the tick rate must match the microsecond event
# granularity of the upstream simulator protocol.
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
embassy-futures = "0.1"
# `poll(2)` for the executor's idle blocking (simulator event socket + the
# cross-thread wake pipe).
nix = { version = "0.30", default-features = false, features = ["poll"] }
log = "0.4"
env_logger = "0.11"
rand = { version = "0.9", features = ["std", "std_rng", "os_rng"] }
static_cell = "2.1"
async-io = "2"
socket2 = { version = "0.5", features = ["all"] }
# C symbols OpenThread's C references;
# `critical-section` with `std` supplies a host `critical-section` impl.
tinyrlibc = { version = "0.5", default-features = false, features = ["utoa", "strtoul"] }
critical-section = { version = "1.2", features = ["std"] }

# `ftd` because the test topologies need router-capable nodes (a network is
# formed by its first router, the Leader). `cli` for the harness-driveable DUT
# binary (`cli_ftd`). `mac-filter` is how the upstream harness builds
# multi-hop topologies (`macfilter` allowlists); `ping-sender` backs the CLI
# `ping` command many of its tests use; the rest widen the CLI surface toward
# what the upstream simulation build offers. No `std`: that feature is the
# RCP serial transport, and these nodes use a local (simulated) radio instead.
# The suite's topology setup registers on-mesh prefixes (`prefix add`),
# sets preferred partition ids and issues `networkdiagnostic get` - all
# CLI surface the upstream reference-device simulation build carries.
openthread = { path = "../openthread", default-features = false, features = [
    "ftd",
    "cli",
    "isupper",
    "log",
    "mac-filter",
    "ping-sender",
    "slaac",
    "ecdsa",
    "dns-client",
    "srp-client",
    "commissioner",
    "joiner",
    "border-router",
    "netdiag-client",
    "reference-device",
    "dhcp6-client",
    "dhcp6-server",
    # The `test_*.py` functional pool additionally exercises the SRP
    # client/server pair, DNS-SD, the service registry / netdata publisher,
    # secure CoAP, and the dataset-updater / child-supervision /
    # history-tracker utilities.
    "srp-server",
    "dnssd-server",
    "service",
    "netdata-publisher",
    # (`coap` also: the CLI's secure-CoAP command references the plain CoAP
    # API, so a `cli`+`coaps` build without `coap` fails to link.)
    "coap",
    "coaps",
    "dataset-updater",
    "child-supervision",
    "history-tracker",
] }
embassy-sync = "0.8"

[[bin]]
path = "./src/bin/sim_node.rs"
name = "sim_node"

[[bin]]
path = "./src/bin/cli_ftd.rs"
name = "cli_ftd"
